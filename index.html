<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
  /* Full-bleed 3D view; HUD top-left, steering slider bottom-left, pedals bottom-right. One look in both themes. */
  :root {
    color-scheme: dark;
    --sky: #8cbfef;
    --hud-bg: rgba(14, 20, 28, 0.62);
    --hud-fg: #f2f5f8;
    --hud-dim: #9fb0c2;
    --pad-bg: rgba(14, 20, 28, 0.42);
    --pad-on: rgba(255, 196, 61, 0.55);
    --accent: #ffc43d;
    --pad-edge: rgba(255, 255, 255, 0.35);
    --gas: #4fd17a;
    --brake: #ff6b5a;
    --under: #6cc4ff;
    --font-hud: "Chakra Petch", ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--sky); color: var(--hud-fg); overflow: hidden;
    font-family: var(--font-hud);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    background: var(--hud-bg); border-radius: 10px; padding: 8px 14px;
    display: grid; gap: 4px; pointer-events: none;
  }
  .row { display: flex; align-items: baseline; gap: 8px; }
  #speed { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #speed.grass { color: var(--brake); }
  .unit { font-size: 12px; color: var(--hud-dim); letter-spacing: .08em; text-transform: uppercase; }
  #gear { font-size: 18px; font-weight: 700; color: var(--accent); min-width: 1ch; }
  .times { font-size: 13px; font-variant-numeric: tabular-nums; }
  .times .unit { min-width: 4.6em; display: inline-block; }
  #section-row[hidden], #fines-row[hidden], #cross-row[hidden], .lap-only[hidden], .city-only[hidden] { display: none; }
  #cross { color: var(--hud-fg); white-space: nowrap; }
  #cross-row .unit { min-width: 3em; }
  /* Open map: the streets around the car, heading up. */
  #minimap { position: static; width: 130px; height: 130px; border-radius: 8px; display: block; margin-top: 2px; }
  #minimap[hidden] { display: none; }
  @media (max-height: 500px) { #minimap { width: 100px; height: 100px; } }
  #section { color: var(--accent); font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
  .top-right {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .top-right button {
    font: 600 13px var(--font-hud); letter-spacing: .08em; text-transform: uppercase;
    color: var(--hud-fg); background: var(--hud-bg); border: 1px solid var(--pad-edge);
    border-radius: 10px; padding: 10px 14px; cursor: pointer;
  }
  .top-right button:focus-visible, .pad:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .top-bar { display: flex; gap: 8px; }
  #reset { height: 44px; }
  #settings-btn { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; }
  #settings-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
  #settings-btn[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
  #settings {
    background: var(--hud-bg); border-radius: 12px; padding: 8px;
    display: grid; gap: 6px; min-width: 190px;
  }
  #settings[hidden] { display: none; }
  #settings button { display: flex; justify-content: space-between; gap: 16px; text-align: left; }
  #settings button b { color: var(--accent); font-weight: 700; }
  #ghost[aria-pressed="false"] b, #sound[aria-pressed="false"] b, #damage[aria-pressed="false"] b, #police[aria-pressed="false"] b { color: var(--hud-dim); }
  /* Start picker: the island's map over everything, a bar of buttons along the bottom. */
  #picker { position: fixed; inset: 0; z-index: 40; background: #26323d; display: flex; flex-direction: column; }
  #picker[hidden] { display: none; }
  #picker canvas { position: static; flex: 1; min-height: 0; width: 100%; height: auto; touch-action: none; cursor: crosshair; }
  .picker-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: rgba(14, 20, 28, 0.92);
  }
  .picker-bar .title { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--hud-dim); }
  #picker-name { flex: 1; min-width: 12em; font-size: 15px; font-weight: 700; color: var(--accent); }
  .picker-bar button {
    font: 600 13px var(--font-hud); letter-spacing: .08em; text-transform: uppercase;
    color: var(--hud-fg); background: var(--hud-bg); border: 1px solid var(--pad-edge);
    border-radius: 10px; padding: 0 14px; min-width: 44px; height: 44px; cursor: pointer;
  }
  .picker-bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #picker-go { background: var(--gas); color: #0e141c; border-color: var(--gas); }
  #picker-go[hidden] { display: none; }
  #balance {
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    min-height: 1.2em;
  }
  #balance.under { color: var(--under); }
  #load.light { color: var(--under); }
  #balance.over { color: var(--brake); }
  /* G-meter: the dot is the push the driver feels (braking = up, left turn = right);
     the dashed ring is what the tires can give. Dot on the ring = at the limit. */
  /* Top right, under the settings button; text sits left of the dial. */
  .gmeter {
    display: flex; flex-direction: row-reverse; align-items: center; gap: 10px;
    background: var(--hud-bg); border-radius: 10px; padding: 8px 10px 8px 14px; pointer-events: none;
  }
  .gm-text { text-align: right; }
  .gmeter svg { width: 84px; height: 84px; display: block; overflow: visible; }
  .gm-bg { fill: rgba(0, 0, 0, 0.25); }
  .gm-grid { fill: none; stroke: var(--hud-dim); stroke-opacity: .35; stroke-width: 1; }
  .gm-limit { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; transition: stroke .15s; }
  .gm-trail { fill: none; stroke: var(--hud-fg); stroke-opacity: .35; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #gdot { fill: var(--gas); transition: fill .15s; }
  .gmeter.near #gdot { fill: var(--accent); }
  .gmeter.slide #gdot, .gmeter.slide .gm-limit { fill: var(--brake); stroke: var(--brake); }
  .gmeter.slide .gm-limit { fill: none; }
  .gm-text { display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
  #gval { font-size: 20px; font-weight: 700; line-height: 1; }
  #guse { font-size: 13px; }
  .gmeter.near #guse { color: var(--accent); }
  .gmeter.slide #guse { color: var(--brake); }
  /* Tire temperatures: a top view of the car, each tire colored from blue (cold)
     through green (in the grip window) to amber and red (overheated). */
  .tires {
    display: flex; flex-direction: row-reverse; align-items: center; gap: 10px;
    background: var(--hud-bg); border-radius: 10px; padding: 8px 10px 8px 14px; pointer-events: none;
  }
  .tires svg { width: 46px; height: 72px; display: block; }
  .tire-body { fill: rgba(0, 0, 0, 0.25); stroke: var(--hud-dim); stroke-opacity: .5; stroke-width: 1.5; }
  .tire { fill: var(--gas); }
  .tire-text { display: grid; gap: 2px; text-align: right; min-width: 7.5em; font-size: 13px; font-variant-numeric: tabular-nums; }
  .tire-text b { font-weight: 700; }
  #tire-state { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .controls {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
    pointer-events: none;
  }
  .group { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
  .pad {
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--pad-bg); border: 2px solid var(--pad-edge); color: var(--hud-fg);
    font: 700 13px var(--font-hud); letter-spacing: .08em; text-transform: uppercase;
    display: grid; place-items: center; touch-action: none; cursor: pointer;
    transition: transform .06s, background .06s;
  }
  .group.steer-group { flex: 1; max-width: 300px; }
  #steer {
    position: relative; flex: 1; height: 72px; border-radius: 36px;
    background: var(--pad-bg); border: 2px solid var(--pad-edge);
    touch-action: none; cursor: grab;
  }
  #steer.on { cursor: grabbing; border-color: var(--accent); }
  /* The knob's center travels along the rail, so it stays inside the track at full lock. */
  #steer .rail { position: absolute; inset: 0 34px; pointer-events: none; }
  #steer .rail::before { /* center mark */
    content: ""; position: absolute; left: 50%; top: 16px; bottom: 16px;
    width: 2px; margin-left: -1px; background: var(--pad-edge);
  }
  #steer .knob {
    position: absolute; top: 50%; left: 50%; width: 52px; height: 52px; border-radius: 50%;
    transform: translate(-50%, -50%); background: var(--hud-fg); opacity: .85;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
  }
  #steer.on .knob { background: var(--accent); opacity: 1; }
  .pad svg { width: 30px; height: 30px; fill: currentColor; }
  .pad.pedal { border-radius: 14px; width: 72px; }
  .pad.pedal.gas { height: 116px; border-color: var(--gas); }
  .pad.pedal.brake { height: 88px; border-color: var(--brake); }
  .pad.on { background: var(--pad-on); transform: scale(.94); }
  .hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(14px + env(safe-area-inset-top, 0px));
    font-size: 12px; color: var(--hud-fg); background: var(--hud-bg);
    padding: 6px 10px; border-radius: 8px; pointer-events: none; white-space: nowrap;
  }
  @media (hover: none), (max-width: 1000px) { .hint { display: none; } }
  /* Short screens (phones in landscape): the G-meter and tire panel sit side by side
     and shrink, so the pedals don't cover them. */
  @media (max-height: 500px) {
    .top-right { display: grid; grid-template-columns: auto auto; justify-items: end; align-items: start; }
    .top-bar, #settings { grid-column: 1 / -1; }
    .gmeter, .tires { padding: 6px 8px 6px 10px; gap: 8px; }
    .gmeter svg { width: 64px; height: 64px; }
    .tires svg { width: 36px; height: 56px; }
    .tire-text { min-width: 6.5em; }
    .pad.pedal.gas { height: 100px; }
    .pad.pedal.brake { height: 76px; }
  }
  /* Speed limit (Montreal): a white sign with a red ring; it turns red when you're well over. */
  .limit {
    align-self: center; margin-left: 2px;
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: #fff; color: #111; border: 3px solid #d0202a;
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1;
  }
  .limit[hidden] { display: none; }
  .limit.over { background: #d0202a; color: #fff; border-color: #fff; }
  /* Car health: a bar under the speed; it flashes when the car takes a hit. */
  .health { display: flex; align-items: center; gap: 6px; }
  .health .bar { flex: 1; min-width: 50px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.15); overflow: hidden; }
  .health .bar i { display: block; height: 100%; width: 100%; background: var(--gas); transition: width .2s; }
  .health.hit { animation: hit .5s; }
  @keyframes hit { 0%, 40% { color: var(--brake); transform: translateX(-2px); } 20% { transform: translateX(2px); } }
  /* Wanted level: stars light up amber; the status says what the police are doing. */
  #wanted-row { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  #wanted-row[hidden] { display: none; }
  #stars { font-size: 15px; letter-spacing: 2px; color: var(--hud-dim); line-height: 1.1; }
  #stars.on { color: var(--accent); }
  #wanted { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--hud-dim); }
  #stars.on + #wanted { color: var(--brake); }
  /* An offence, briefly, in the middle, over the panels. */
  #toast {
    position: fixed; left: 50%; top: 56%; transform: translate(-50%, -6px); z-index: 20;
    max-width: calc(100vw - 32px); box-sizing: border-box;
    background: rgba(160, 20, 24, 0.85); color: #fff; border-radius: 8px; padding: 7px 12px;
    font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; text-align: center;
    pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* Busted / Wrecked, in the middle of the screen. */
  #banner {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 20;
    max-width: calc(100vw - 32px); box-sizing: border-box;
    background: rgba(14, 20, 28, 0.86); border-radius: 14px; padding: 14px 22px; text-align: center;
    display: grid; gap: 4px; pointer-events: none;
  }
  #banner[hidden] { display: none; }
  #banner b { font-size: 40px; letter-spacing: .12em; text-transform: uppercase; line-height: 1; }
  #banner span { font-size: 13px; color: var(--hud-dim); }
  #banner.busted b { color: #6ea8ff; }
  #banner.wrecked b { color: var(--brake); }
  /* Patrol cars close: red and blue glow at the screen's edges. */
  #pursuit {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
    animation: siren .5s steps(1) infinite;
  }
  @keyframes siren {
    0% { box-shadow: inset 60px 0 60px -40px rgba(255, 40, 40, .55), inset -60px 0 60px -40px rgba(40, 90, 255, .25); }
    50% { box-shadow: inset 60px 0 60px -40px rgba(255, 40, 40, .25), inset -60px 0 60px -40px rgba(40, 90, 255, .55); }
  }
  /* A cracked windshield (cockpit view, front damage). */
  #crack { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; }
  #crack path { fill: none; stroke: rgba(235, 240, 245, 0.6); stroke-width: 1.4; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  @media (prefers-reduced-motion: reduce) {
    .pad { transition: none; }
    #pursuit { animation: none; box-shadow: inset 0 0 60px rgba(255, 60, 60, .4); }
    .health.hit { animation: none; }
  }
</style>
</head>
<body>
<canvas id="gl" aria-label="3D driving view"></canvas>
<svg id="crack" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <path d="M30 62 L18 48 L9 44 M30 62 L22 75 L14 92 M30 62 L44 54 L58 50 L71 41 M30 62 L41 71 L52 88 M30 62 L27 44 L31 28 M30 62 L12 63 L2 60 M22 75 L30 80 M44 54 L46 44 M18 48 L22 41 M41 71 L50 67 M58 50 L60 60"/>
  <path d="M26 58 L34 60 L33 66 L27 67 Z"/>
</svg>
<div id="pursuit" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<div id="banner" hidden role="alert"><b></b><span></span></div>
<div id="hud">
  <div class="row"><span id="speed">  0</span><span class="unit">km/h</span><span id="gear">N</span><span id="limit" class="limit" hidden title="Speed limit (km/h)">50</span></div>
  <div class="times health" title="What's left of the car: crashes damage it"><span class="unit">Car</span><span id="health">100%</span><span class="bar"><i id="health-bar"></i></span></div>
  <div id="wanted-row" class="times" hidden aria-live="polite"><span id="stars" title="Wanted level">☆☆☆☆☆</span><span id="wanted"></span></div>
  <div class="times" id="fines-row" hidden title="Fines paid so far"><span class="unit">Fines</span><span id="fines">$0</span></div>
  <div class="times" id="section-row" hidden><span id="section"></span></div>
  <div class="times city-only" id="cross-row" hidden title="The next street that crosses this one"><span class="unit">Next</span><span id="cross"></span></div>
  <div class="times lap-only"><span class="unit" id="lap-label">Lap</span><span id="lap">–:––.––</span></div>
  <div class="times lap-only"><span class="unit">Best</span><span id="best">–:––.––</span></div>
  <div class="times lap-only" title="Claude's run, the amber ghost"><span class="unit">Claude</span><span id="bot">–:––.––</span></div>
  <div class="times"><span class="unit">Grade</span><span id="grade">0%</span></div>
  <div class="times" title="Weight on front / rear axle, % of the car's weight"><span class="unit">F / R</span><span id="load">50 / 50</span></div>
  <div id="balance" aria-live="polite"></div>
  <canvas id="minimap" hidden aria-label="Map of the streets around the car"></canvas>
</div>
<div class="hint">W/S or ↑/↓ drive · A/D or ←/→ steer · Space handbrake · T car (Yaris/GT3) · G ghost · C camera · M track · P start · R reset</div>
<div class="top-right">
  <div class="top-bar">
  <button id="reset" type="button" aria-label="Reset car (R)">Reset</button>
  <button id="settings-btn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  </div>
  <div id="settings" hidden>
    <button id="layout" type="button" aria-label="Switch track: the open map of the island of Montreal, or the Nürburgring Nordschleife or GP circuit (M)">Track <b>Montreal</b></button>
    <button id="view" type="button" aria-label="Switch camera view (C)">Camera <b>Cockpit</b></button>
    <button id="drive" type="button" aria-label="Switch car (T)">Car <b>GT3</b></button>
    <button id="ghost" type="button" aria-pressed="true" aria-label="Show ghosts: your best lap and Claude's (G)">Ghost <b>On</b></button>
    <button id="sound" type="button" aria-pressed="true" aria-label="Engine and tire sounds (N)">Sound <b>On</b></button>
    <button id="damage" type="button" aria-pressed="true" aria-label="Crash damage">Damage <b>On</b></button>
    <button id="police" type="button" class="city-only" aria-pressed="true" aria-label="Police and the rules of the road (Montreal)">Police <b>On</b></button>
    <button id="start" type="button" class="city-only" aria-label="Choose where to start on the map of Montreal (P)">Start <b>Pick on map</b></button>
  </div>
  <div class="gmeter" id="gmeter">
    <svg viewBox="-44 -44 88 88" role="img" aria-label="G-force meter: dot is the force felt, dashed ring is the grip limit">
      <circle class="gm-bg" r="44"/>
      <circle class="gm-grid" r="14"/>
      <circle class="gm-grid" r="28"/>
      <path class="gm-grid" d="M-44 0H44M0 -44V44"/>
      <circle class="gm-limit" id="glimit" r="28"/>
      <polyline class="gm-trail" id="gtrail" points=""/>
      <circle id="gdot" r="4.5"/>
    </svg>
    <div class="gm-text">
      <div><span id="gval">0.00</span> <span class="unit">g</span></div>
      <div title="Share of the tires' grip in use (busiest axle)"><span class="unit">Grip</span> <span id="guse">0%</span></div>
    </div>
  </div>
  <div class="tires" id="tires" role="img" aria-label="Tire temperatures">
    <svg viewBox="0 0 46 72" aria-hidden="true">
      <rect class="tire-body" x="9" y="4" width="28" height="64" rx="9"/>
      <rect class="tire" id="tire-fl" x="2" y="12" width="8" height="15" rx="2.5"/>
      <rect class="tire" id="tire-fr" x="36" y="12" width="8" height="15" rx="2.5"/>
      <rect class="tire" id="tire-rl" x="2" y="46" width="8" height="15" rx="2.5"/>
      <rect class="tire" id="tire-rr" x="36" y="46" width="8" height="15" rx="2.5"/>
    </svg>
    <div class="tire-text" title="Tire temperature per axle. Best grip between 80 and 100 °C">
      <div><span class="unit">Tires</span></div>
      <div><span class="unit">F</span> <b id="tire-f">45°</b></div>
      <div><span class="unit">R</span> <b id="tire-r">45°</b></div>
      <div id="tire-state">Cold</div>
    </div>
  </div>
</div>
<div id="picker" hidden role="dialog" aria-modal="true" aria-label="Choose where to start">
  <canvas aria-label="Map of the island of Montreal: tap a street to choose it"></canvas>
  <div class="picker-bar">
    <span class="title">Start at</span>
    <span id="picker-name" aria-live="polite"></span>
    <button id="picker-go" type="button" hidden>Start here</button>
    <button id="picker-in" type="button" aria-label="Zoom in">+</button>
    <button id="picker-out" type="button" aria-label="Zoom out">−</button>
    <button id="picker-default" type="button">Default start</button>
    <button id="picker-close" type="button">Close</button>
  </div>
</div>
<div class="controls">
  <div class="group steer-group">
    <div id="steer" role="slider" aria-label="Steering: slide left or right" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0">
      <div class="rail"><div class="knob"></div></div>
    </div>
  </div>
  <div class="group">
    <button class="pad pedal brake" data-ctl="brake" type="button">Brake</button>
    <button class="pad pedal gas" data-ctl="gas" type="button">Gas</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
